<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a request-path rail on the left (stops in call order), the logic diff for each stop on the right. Tests are left out on purpose. */
:root{
  --ground:#f3f5f7; --sheet:#ffffff; --ink:#18212b; --mute:#5b6876; --line:#dbe1e7;
  --route:#0f6f8a; --route-soft:#e2f1f5;
  --prod:#a8550a; --prod-soft:#fbeedd;
  --test:#3a5f8f; --test-soft:#e6edf7;
  --plumb:#6b7682; --plumb-soft:#eceff2;
  --add:#e6f4ea; --add-ink:#1a6b34; --rem:#fbe9e9; --rem-ink:#a4282c;
  --code-bg:#fafbfc;
  --f-display:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ground:#0f141a; --sheet:#161d25; --ink:#e3e9ef; --mute:#93a0ad; --line:#2a343f;
  --route:#5cc3dc; --route-soft:#15313a;
  --prod:#f0a75c; --prod-soft:#3a2614;
  --test:#8fb0e0; --test-soft:#1c2a3d;
  --plumb:#9aa5b0; --plumb-soft:#222b34;
  --add:#13301d; --add-ink:#7fd59a; --rem:#3a1719; --rem-ink:#f19a9c;
  --code-bg:#121820;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0f141a; --sheet:#161d25; --ink:#e3e9ef; --mute:#93a0ad; --line:#2a343f;
  --route:#5cc3dc; --route-soft:#15313a;
  --prod:#f0a75c; --prod-soft:#3a2614;
  --test:#8fb0e0; --test-soft:#1c2a3d;
  --plumb:#9aa5b0; --plumb-soft:#222b34;
  --add:#13301d; --add-ink:#7fd59a; --rem:#3a1719; --rem-ink:#f19a9c;
  --code-bg:#121820;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:15px/1.6 var(--f-body);padding-inline:20px}
.wrap{max-width:1180px;margin:0 auto;padding-block:36px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
code,.path{font-family:var(--f-mono)}
a{color:var(--route)}
:focus-visible{outline:2px solid var(--route);outline-offset:2px;border-radius:4px}

/* header */
.top{display:grid;gap:18px;margin-bottom:28px}
.eyebrow{font:600 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--route)}
h1{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.01em}
.sub{color:var(--mute);max-width:68ch;margin:0}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;font:13px var(--f-mono);color:var(--mute)}
.meta b{color:var(--ink);font-weight:600}

.split{display:grid;gap:10px;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.split h4{margin:0;font:600 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--plumb-soft)}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legend b{color:var(--ink)}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters span{font-size:13px;color:var(--mute);margin-right:4px}
.filters button{font:500 13px var(--f-body);color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}

/* layout */
.cols{display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px;align-items:start}
nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
nav.rail h4{margin:0 0 10px;font:600 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
nav.rail ol{list-style:none;margin:0;padding:0;position:relative}
nav.rail ol::before{content:"";position:absolute;left:13px;top:14px;bottom:14px;width:2px;background:var(--route-soft)}
nav.rail li a{position:relative;display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:7px 0;text-decoration:none;color:var(--ink);font-weight:500}
nav.rail .no{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--sheet);border:2px solid var(--route);color:var(--route);font:600 12px var(--f-mono)}
nav.rail a.hasprod .no{border-color:var(--prod);color:var(--prod)}
nav.rail .nl{font:12px var(--f-mono);color:var(--mute);font-variant-numeric:tabular-nums}
nav.rail .hint{margin-top:14px;font-size:12px;color:var(--mute)}
nav.rail .hint i{display:inline-block;width:9px;height:9px;border-radius:50%;border:2px solid var(--prod);margin-right:6px;vertical-align:-1px}

.stop{display:grid;gap:14px;margin-bottom:40px;scroll-margin-top:16px}
.sh{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.sh .no{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--route);color:var(--sheet);font:700 15px var(--f-display)}
.sh h2{font-size:22px;font-weight:700}
.lede{margin:2px 0 0;color:var(--mute);max-width:70ch}

.card{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:8px}
.card[data-imp="prod"]{border-color:color-mix(in srgb,var(--prod) 45%,var(--line))}
.ch{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.ch h3{font-size:16px;font-weight:700;flex:1 1 260px}
.chip{font:600 11px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:4px;white-space:nowrap}
.chip.prod{background:var(--prod-soft);color:var(--prod)}
.chip.feature{background:var(--test-soft);color:var(--test)}
.chip.plumb{background:var(--plumb-soft);color:var(--plumb)}
.path{font-size:12px;color:var(--mute);overflow-wrap:anywhere}
.note{margin:0;max-width:75ch}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.dw>summary{font:600 12px var(--f-mono);color:var(--mute);display:flex;gap:10px;align-items:center}
.dw>summary::before{content:"\25B8";transition:transform .15s}
.dw[open]>summary::before{transform:rotate(90deg)}
.fold>summary{display:grid;gap:6px}
.fold>summary .cnt{font:12px var(--f-mono)}
.fold:not([open]) .note{color:var(--mute)}
.cnt b{font-weight:600}.cnt .p{color:var(--add-ink)}.cnt .m{color:var(--rem-ink)}

.hh{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;padding:6px 10px;background:var(--route-soft);border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;font:12px var(--f-mono);color:var(--route)}
.hh .ctx{color:var(--mute);flex:1;min-width:0;overflow-wrap:anywhere}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:0 0 6px 6px;background:var(--code-bg)}
table.diff{border-collapse:collapse;font:12.5px/1.55 var(--f-mono);width:100%}
.diff td{padding:0 8px;vertical-align:top}
.diff .ln{width:1%;text-align:right;color:var(--mute);opacity:.7;user-select:none;font-variant-numeric:tabular-nums}
.diff .sg{width:1%;user-select:none;color:var(--mute)}
.diff .cd{white-space:pre;color:var(--ink)}
.diff tr.ad{background:var(--add)}.diff tr.ad .sg{color:var(--add-ink)}
.diff tr.rm{background:var(--rem)}.diff tr.rm .sg{color:var(--rem-ink)}

.live{background:var(--sheet);border:1px solid color-mix(in srgb,var(--prod) 45%,var(--line));border-radius:10px;padding:18px;display:grid;gap:12px}
.live h2{font-size:20px}
.live .tw{overflow-x:auto}
.live table{border-collapse:collapse;width:100%;font-size:14px}
.live th,.live td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.live th{font:600 12px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.live td:first-child{font-weight:600}
.live .was{color:var(--rem-ink)}.live .now{color:var(--add-ink)}
.st{margin:0;padding:10px 12px;background:var(--route-soft);border-radius:6px;font-size:14px}
.st b{font-family:var(--f-mono);color:var(--route)}

.hide{display:none}
@media (max-width:820px){.cols{grid-template-columns:1fr}nav.rail{position:static}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
html{scroll-behavior:smooth}

.files{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:8px}
.files h4{margin:0;font:600 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.files .tw{overflow-x:auto}
.files table{border-collapse:collapse;width:100%;font-size:13.5px}
.files th,.files td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.files th{font:600 11px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.files td.n{font-variant-numeric:tabular-nums;text-align:right;font-family:var(--f-mono)}
.files td .chip{margin-right:4px}
</style>

<div class="wrap">
  <header class="top">
    <div class="eyebrow">{{EYEBROW}}</div>
    <h1>{{H1}}</h1>
    <p class="sub">{{SUB}}</p>
    <div class="meta">{{META}}</div>
    <div class="split">
      <h4>Where the {{LOGIC_LINES}} production-code lines land (counted per change, not per file)</h4>
      <div class="bar" role="img" aria-label="Lines by impact">{{BAR}}</div>
      <div class="legend">{{LEGEND}}</div>
    </div>
    <div class="files">
      <h4>The {{LOGIC_FILES}} production-code files</h4>
      <div class="tw"><table><thead><tr><th>File</th><th>Lines</th><th>Changes</th><th>Tags</th></tr></thead><tbody>{{FILES}}</tbody></table></div>
    </div>
    <div class="filters" role="group" aria-label="Filter changes">
      <span>Show</span>
      <button type="button" id="f-all" data-f="all" aria-pressed="true">Everything</button>
      <button type="button" id="f-prod" data-f="prod" aria-pressed="false">{{L_prod}}</button>
      <button type="button" id="f-feature" data-f="feature" aria-pressed="false">{{L_feature}}</button>
      <button type="button" id="f-noplumb" data-f="noplumb" aria-pressed="false">Hide plumbing</button>
    </div>
  </header>
  <div class="cols">
    <nav class="rail" aria-label="Request path">
      <h4>{{RAIL}}</h4>
      <ol>{{NAV}}</ol>
      <p class="hint"><i></i>Stop has {{L_prod_lc}}</p>
    </nav>
    <main>{{SECTIONS}}{{LIVE}}</main>
  </div>
</div>
<script>
(function(){
  var btns=[].slice.call(document.querySelectorAll('.filters button'));
  function apply(f){
    btns.forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.f===f))});
    document.querySelectorAll('.card').forEach(function(c){
      var i=c.dataset.imp,show=f==='all'||(f==='noplumb'?i!=='plumb':i===f);
      c.classList.toggle('hide',!show);
    });
    document.querySelectorAll('section.stop:not(#live)').forEach(function(s){
      s.classList.toggle('hide',!s.querySelector('.card:not(.hide)'));
    });
  }
  btns.forEach(function(b){b.addEventListener('click',function(){apply(b.dataset.f)})});
})();
</script>
